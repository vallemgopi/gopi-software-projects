server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 location / { try_files $uri /index.html; }
 location /api/ { proxy_pass http://api:8080; proxy_set_header X-QueryFence-Local "${LOCAL_DEMO_SECRET}"; proxy_read_timeout 40s; client_max_body_size 16k; }
 location /swagger-ui/ { proxy_pass http://api:8080; }
 location /v3/api-docs { proxy_pass http://api:8080; }
 error_page 413 = @too_large;
 location @too_large { default_type application/json; return 413 '{"timestamp":"$time_iso8601","code":"REQUEST_TOO_LARGE","message":"Request body must be at most 16 KiB.","requestId":"$request_id"}'; }
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy same-origin;
}
