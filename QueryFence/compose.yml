services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: queryfence
      POSTGRES_USER: queryfence_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup-env first}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?Run setup-env first}
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?Run scripts/upgrade-env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./db/02-control-role.sh:/docker-entrypoint-initdb.d/02-control-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U queryfence_owner -d queryfence"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/queryfence
      DB_PASSWORD: ${DB_PASSWORD:?Run setup-env first}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?Run setup-env first}
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?Run scripts/upgrade-env first}
      LOCAL_DEMO_SECRET: ${LOCAL_DEMO_SECRET:?Run scripts/upgrade-env first}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_ORIGINS: ${DEMO_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      QUERY_MAX_COST: ${QUERY_MAX_COST:-10000}
      QUERY_MAX_SCAN_ROWS: ${QUERY_MAX_SCAN_ROWS:-100000}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      PLANNER_MODE: ${PLANNER_MODE:-demo}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_MODEL_VERSION: ${OLLAMA_MODEL_VERSION:-unverified}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build: ./web
    environment:
      LOCAL_DEMO_SECRET: ${LOCAL_DEMO_SECRET:?Run scripts/upgrade-env first}
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
