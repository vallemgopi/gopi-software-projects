limit_req_zone $binary_remote_addr zone=public_intake:10m rate=10r/m;
server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "microphone=(self)" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 location /api/phone/twilio/ {
  client_max_body_size 64k;
  proxy_pass http://api:8080;
  proxy_read_timeout 15s;
 }
 location /api/public/submissions {
  limit_req zone=public_intake burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://api:8080;
  proxy_read_timeout 310s;
 }
 location /api/ { proxy_pass http://api:8080; proxy_read_timeout 310s; }
 location / { try_files $uri /index.html; }
}
