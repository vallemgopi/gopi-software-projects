services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voicelab
      POSTGRES_USER: ${DB_USER:-lab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d voicelab"]
      interval: 5s
      timeout: 3s
      retries: 20
  ml:
    build: ./ml
    environment:
      WHISPER_MODEL_PATH: /models/whisper-base
    volumes: ["./.models:/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/voicelab
      DB_USER: ${DB_USER:-lab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DEMO_USER: ${DEMO_USER:-reviewer}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      ML_URL: http://ml:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RETAIN_AUDIO: ${RETAIN_AUDIO:-false}
      PUBLIC_INTAKE_ENABLED: ${PUBLIC_INTAKE_ENABLED:-true}
      PHONE_ENABLED: ${PHONE_ENABLED:-false}
      PHONE_PUBLIC_BASE_URL: ${PHONE_PUBLIC_BASE_URL:-}
      PHONE_PUBLIC_NUMBER: ${PHONE_PUBLIC_NUMBER:-}
      PHONE_PROMPTS_BASE_URL: ${PHONE_PROMPTS_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      ml: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 30
  web:
    build: ./web
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
