name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -f api/pom.xml verify
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r ml/requirements.lock
      - run: python scripts/prepare_github.py
      - run: python -m unittest discover -s scripts -p test_prepare_github.py
      - run: cd ml && pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: cd web && npm ci && npm test && npm run build && npx playwright install --with-deps chromium
      - run: cp .env.example .env && docker compose up --build -d --wait
      - run: cd web && BASE_URL=http://localhost:5173 npm run e2e
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
